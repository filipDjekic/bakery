services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pekara_integration_test
      POSTGRES_USER: pekara_test
      POSTGRES_PASSWORD: pekara_test
    ports:
      - '${TEST_POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U pekara_test -d pekara_integration_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
