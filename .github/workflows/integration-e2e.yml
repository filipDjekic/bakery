name: Integration and E2E

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pekara_ci:pekara_ci@127.0.0.1:5432/pekara_ci_test
  APP_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
  RATE_LIMIT_HMAC_SECRET: ci-only-rate-limit-secret-with-at-least-32-characters
  ALLOW_INTEGRATION_DB_RESET: "true"
  SENTRY_ENVIRONMENT: ci
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci

jobs:
  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pekara
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pekara_ci_test
          POSTGRES_USER: pekara_ci
          POSTGRES_PASSWORD: pekara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pekara_ci -d pekara_ci_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          working-directory: pekara
          require-lockfile: true
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma contract
        run: pnpm prisma:generate

      - name: Migrate and reset integration database
        run: pnpm integration:db:prepare

      - name: Run integration tests
        run: >-
          node --env-file=.env.test --conditions=react-server
          --experimental-strip-types --test --test-concurrency=1
          tests/integration/*.test.ts

  e2e:
    name: Customer and admin Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pekara
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pekara_ci_test
          POSTGRES_USER: pekara_ci
          POSTGRES_PASSWORD: pekara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pekara_ci -d pekara_ci_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          working-directory: pekara
          require-lockfile: true
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma contract
        run: pnpm prisma:generate

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate integration database
        run: pnpm integration:db:migrate

      - name: Seed catalog and bootstrap test administrator
        run: pnpm e2e:seed

      - name: Build application
        run: pnpm build

      - name: Run customer and admin browser tests
        run: pnpm exec playwright test e2e/customer-order.spec.ts e2e/admin-orders.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: pekara/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
